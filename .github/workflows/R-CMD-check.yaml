name: R-CMD-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Explicit labels keep Intel and ARM coverage when macos-latest moves.
        os: [macos-15-intel, macos-15, macos-26-intel, macos-26]
        r: [release, oldrel-1]
        include:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: windows-latest, r: release}
          - {os: windows-latest, r: oldrel-1}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          # Use CRAN's native macOS/Windows binaries directly. A stale P3M
          # Arrow index can point to a binary that is no longer downloadable.
          use-public-rspm: ${{ runner.os == 'Linux' }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Require optional test dependencies
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("haven", quietly = TRUE))
          stopifnot(requireNamespace("arrow", quietly = TRUE))
          stopifnot(utils::packageVersion("arrow") >= "18.1.0")
          stopifnot(arrow::arrow_with_parquet())
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          upload-results: true
          artifact-name: check-${{ matrix.os }}-${{ matrix.r }}

  minimum-dependencies:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / minimum dependencies
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel, macos-15]
        r: ['4.4']
        include:
          - {os: ubuntu-22.04, r: '4.1'}
    env:
      # Archived packages may use R APIs removed in newer R versions. Test
      # their lower bounds on R 4.4; the jobs above test current dependencies.
      LIBARROW_BINARY: 'true'
      LIBARROW_BUILD: 'true'
      LIBARROW_MINIMAL: 'false'
      ARROW_PARQUET: 'ON'
      ARROW_S3: 'OFF'
      ARROW_GCS: 'OFF'
      ARROW_USE_PKG_CONFIG: 'false'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: ${{ runner.os == 'Linux' }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            Rcpp@1.0.14
            hms@0.5.0
            testthat@3.3.0
            haven@2.5.5
            arrow@18.1.0
          # All our optional test packages are pinned above. Do not install
          # their own Suggests (e.g. DuckDB, which no longer supports R 4.1).
          dependencies: '"hard"'
          # No vignettes need these tools. Auto-detection resolves current
          # Arrow again without our pin, which cannot install on R 4.1.
          install-pandoc: false
          install-quarto: false
          needs: check
      - name: Verify exact minimum versions and Parquet support
        run: Rscript tools/ci/verify-minimum-dependencies.R
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          upload-results: true
          artifact-name: check-minimum-${{ matrix.os }}-${{ matrix.r }}

  linux-toolchains:
    name: ${{ matrix.distro }} / ${{ matrix.compiler }} / R-devel / Arrow ${{ matrix.arrow }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora]
        compiler: [gcc, clang]
        arrow: [parquet]
        include:
          - distro: debian
            image: ghcr.io/r-hub/containers/debian-clang:latest
          - distro: fedora
            image: ghcr.io/r-hub/containers/gcc16:latest
          # Reproduce CRAN's Arrow library built without Parquet support.
          - distro: debian
            image: ghcr.io/r-hub/containers/debian-clang:latest
            compiler: gcc
            arrow: no-parquet
    container:
      image: ${{ matrix.image }}
    env:
      CI_COMPILER: ${{ matrix.compiler }}
      CI_ARROW: ${{ matrix.arrow }}
      R_MAKEVARS_USER: /tmp/anotherSAS7bdat-ci.Makevars
      R_LIBS_USER: /tmp/anotherSAS7bdat-ci-library
      NOT_CRAN: 'true'
      _R_CHECK_CRAN_INCOMING_: 'false'
      _R_CHECK_SYSTEM_CLOCK_: 'false'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up compiler and system dependencies
        run: bash tools/ci/setup-linux.sh
      - name: Install R dependencies with the selected C++ runtime
        run: Rscript tools/ci/install-dependencies.R
      - name: Report test environment
        run: |
          cat /etc/os-release
          R --version
          R CMD config CC
          R CMD config CXX17
          Rscript -e 'sessionInfo(); print(arrow::arrow_info())'
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          upload-results: true
          artifact-name: check-${{ matrix.distro }}-${{ matrix.compiler }}-${{ matrix.arrow }}
