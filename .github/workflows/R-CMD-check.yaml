name: R-CMD-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release, compiler: gcc}
          - {os: ubuntu-latest, r: oldrel, compiler: gcc}
          - {os: ubuntu-latest, r: devel, compiler: gcc}
          - {os: ubuntu-latest, r: devel, compiler: clang}
          - {os: ubuntu-22.04, r: '4.1.3', compiler: gcc}
          - {os: windows-latest, r: release, compiler: mingw}
          - {os: windows-latest, r: oldrel, compiler: mingw}
          - {os: windows-latest, r: devel, compiler: mingw}
          - {os: macos-15-arm64, r: release, compiler: apple-clang}
          - {os: macos-15-arm64, r: oldrel, compiler: apple-clang}
          - {os: macos-15-intel, r: release, compiler: apple-clang}
          - {os: macos-15-intel, r: oldrel, compiler: apple-clang}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Configure Linux Clang toolchain
        if: matrix.compiler == 'clang'
        run: |
          mkdir -p ~/.R
          echo 'CC = clang' >> ~/.R/Makevars
          echo 'CXX17 = clang++' >> ~/.R/Makevars
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Show compiler and R version
        shell: Rscript {0}
        run: |
          cat(R.version.string, "\n")
          cat("CXX17 =", system2(file.path(R.home("bin"), "R"), c("CMD", "config", "CXX17"), stdout = TRUE), "\n")
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
